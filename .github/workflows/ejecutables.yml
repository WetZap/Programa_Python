# Ejecutables independientes (no hace falta instalar Python):
#   Windows  instalador .exe (Inno Setup) y zip portable
#   macOS    .dmg para Apple Silicon (macos-15) y para Intel (macos-15-intel)
#   Linux    AppImage (se construye en Ubuntu 22.04: funciona con glibc ≥ 2.35)
#
# Cada ejecutable se prueba abriendo la interfaz sin pantalla y haciendo un ajuste
# (ajustelab --probar-interfaz). Además, se instala el de Windows y se abre de verdad,
# se monta el .dmg y se abre la app, y la AppImage se prueba en X11 en contenedores
# limpios de varias distribuciones.
#
# Al subir una etiqueta «vX.Y.Z» se publica una Release de GitHub con todos los ficheros.
name: ejecutables

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - "empaquetado/**"
      - ".github/workflows/ejecutables.yml"
      - "ajustelab/lanzador.py"
      - "ajustelab/escritorio.py"
  workflow_dispatch:

jobs:
  construir:
    name: ${{ matrix.nombre }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - nombre: Windows x64
            os: windows-latest
          - nombre: macOS Apple Silicon
            os: macos-15
          - nombre: macOS Intel
            os: macos-15-intel
          - nombre: Linux x86_64 (AppImage)
            os: ubuntu-22.04
    runs-on: ${{ matrix.os }}
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Bibliotecas de Qt para X11 y Wayland (van dentro de la AppImage)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libfontconfig1 \
            libdbus-1-3 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 libwayland-client0 \
            libwayland-cursor0 libwayland-egl1
      - name: Inno Setup (instalador de Windows)
        if: runner.os == 'Windows'
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
      - name: Instalar ajustelab y PyInstaller
        run: python -m pip install . "pyinstaller>=6.10" pillow
      - name: La etiqueta coincide con la versión
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          v=$(python -c "import ajustelab; print(ajustelab.__version__)")
          test "v$v" = "${GITHUB_REF_NAME}" || { echo "La etiqueta ${GITHUB_REF_NAME} no coincide con la versión $v"; exit 1; }
      - name: Construir y probar (sin pantalla)
        run: python empaquetado/construir.py --probar
      - name: Hay instalador de Windows
        if: runner.os == 'Windows'
        shell: bash
        run: ls dist/ajustelab-*-windows-x64-instalador.exe dist/ajustelab-*-windows-x64-portable.zip
      - name: Instalar en silencio, abrir de verdad y desinstalar (Windows)
        if: runner.os == 'Windows'
        run: |
          $instalador = Get-ChildItem dist\ajustelab-*-instalador.exe | Select-Object -First 1
          $p = Start-Process $instalador.FullName -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/CURRENTUSER', '/TASKS=asociar' -Wait -PassThru
          if ($p.ExitCode) { throw "El instalador ha fallado ($($p.ExitCode))" }
          $raiz = "$env:LOCALAPPDATA\Programs\WetZap\ajustelab"
          if (-not (Test-Path "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\ajustelab.lnk")) { throw 'Falta el acceso del menu Inicio' }
          if ((Get-ItemProperty 'HKCU:\Software\Classes\.ajustelab').'(default)' -ne 'ajustelab.sesion') { throw 'Falta la asociacion' }
          $p = Start-Process "$raiz\ajustelab.exe" -ArgumentList '--probar-interfaz' -Wait -PassThru
          if ($p.ExitCode) { throw "La app instalada no abre ($($p.ExitCode))" }
          # El desinstalador se copia a TEMP y se relanza: hay que esperar a que acabe
          Start-Process "$raiz\unins000.exe" -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES' -Wait
          for ($i = 0; $i -lt 60 -and (Test-Path "$raiz\unins000.exe"); $i++) { Start-Sleep -Seconds 2 }  # se borra lo último
          if (Test-Path "$raiz\ajustelab.exe") { throw 'Queda el programa' }
          if (Test-Path 'HKCU:\Software\Classes\ajustelab.sesion') { throw 'Queda la asociacion' }
          'Instalado, abierto y desinstalado sin restos'
      - name: Montar el .dmg y abrir la app de verdad (macOS)
        if: runner.os == 'macOS'
        run: |
          dmg=$(ls dist/ajustelab-*.dmg)
          hdiutil attach "$dmg" -mountpoint /tmp/ajustelab-dmg -nobrowse
          codesign --verify --deep --strict /tmp/ajustelab-dmg/ajustelab.app
          /tmp/ajustelab-dmg/ajustelab.app/Contents/MacOS/ajustelab --probar-interfaz
          hdiutil detach /tmp/ajustelab-dmg
      - uses: actions/upload-artifact@v6
        with:
          name: ajustelab-${{ matrix.os }}
          path: |
            dist/ajustelab-*.AppImage
            dist/ajustelab-*.exe
            dist/ajustelab-*.zip
            dist/ajustelab-*.dmg
          if-no-files-found: error
          compression-level: 0  # ya van comprimidos

  appimage-distros:
    name: AppImage en ${{ matrix.imagen }}
    needs: construir
    strategy:
      fail-fast: false
      matrix:
        include:
          # Solo lo que tiene cualquier escritorio: el servidor gráfico (aquí Xvfb),
          # OpenGL/EGL de Mesa y libxcb. Lo demás lo trae la AppImage.
          - imagen: ubuntu:22.04
            preparar: apt-get update -qq && apt-get install -y -qq xvfb libegl1 libgl1 libxcb1
          - imagen: debian:stable
            preparar: apt-get update -qq && apt-get install -y -qq xvfb libegl1 libgl1 libxcb1
          - imagen: fedora:latest
            preparar: dnf install -y xorg-x11-server-Xvfb mesa-libEGL mesa-libGL libxcb
          - imagen: archlinux:latest
            preparar: pacman -Syu --noconfirm --needed xorg-server-xvfb mesa libglvnd libxcb
          - imagen: opensuse/tumbleweed
            preparar: zypper --non-interactive install xorg-x11-server-Xvfb Mesa-libEGL1 Mesa-libGL1 libxcb1
    runs-on: ubuntu-latest
    container: ${{ matrix.imagen }}
    env:
      LANG: C.UTF-8
      APPIMAGE_EXTRACT_AND_RUN: "1"  # en el contenedor no hay FUSE
    steps:
      - name: Preparar el contenedor
        run: ${{ matrix.preparar }}
      - uses: actions/download-artifact@v6
        with:
          name: ajustelab-ubuntu-22.04
      - name: Abrir la ventana en X11 (plugin xcb)
        run: |
          chmod +x ajustelab-*.AppImage
          Xvfb :99 -screen 0 1280x800x24 &
          sleep 3
          DISPLAY=:99 QT_QPA_PLATFORM=xcb ./ajustelab-*.AppImage --probar-interfaz
      - name: Sin pantalla y --version
        run: |
          ./ajustelab-*.AppImage --version
          QT_QPA_PLATFORM=offscreen ./ajustelab-*.AppImage --probar-interfaz

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [construir, appimage-distros]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v6
        with:
          path: dist
          merge-multiple: true
      - name: Sumas SHA-256
        run: cd dist && sha256sum ajustelab-* > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Publicar la Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* --title "ajustelab ${GITHUB_REF_NAME#v}" \
              --notes-file empaquetado/notas_release.md --generate-notes
          fi
