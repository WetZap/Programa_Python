# Ejecuta los tests en Linux, Windows y macOS con la versión de Python más
# antigua soportada, la 3.13 y la más reciente (3.14). La interfaz se prueba sin pantalla
# (QT_QPA_PLATFORM=offscreen).
#
# Además, prueba el instalador de Linux (instalar.sh) en contenedores limpios de
# varias distribuciones: instala Python y las bibliotecas que necesita Qt con el
# gestor de paquetes de cada una, y abre la ventana de verdad en X11 (Xvfb).
name: tests

on:
  push:
  pull_request:

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Bibliotecas de sistema que necesita Qt (solo Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 desktop-file-utils
      - name: Instalar
        run: python -m pip install -e . pytest
      - name: Tests rápidos (incluye la interfaz)
        run: python -m pytest -m "not lento"
      - name: Validación Monte Carlo completa
        if: runner.os == 'Linux' && matrix.python == '3.14'
        run: python -m pytest -m lento

  instalador-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: ShellCheck (POSIX sh)
        run: shellcheck -s sh instalar.sh
      - name: Sintaxis en dash, bash y busybox
        run: |
          dash -n instalar.sh
          bash -n instalar.sh
          sudo apt-get install -y -qq busybox >/dev/null && busybox sh -n instalar.sh

  instalador-distros:
    name: instalar.sh en ${{ matrix.imagen }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # «preparar» solo deja lo que actions/checkout necesita (tar y gzip) y
          # sincroniza la base de datos de pacman; Python y las bibliotecas de Qt
          # las tiene que instalar instalar.sh.
          - imagen: archlinux:latest
            preparar: pacman -Syu --noconfirm --needed tar gzip
            herramientas: pacman -S --needed --noconfirm xorg-server-xvfb desktop-file-utils
          - imagen: debian:stable
            preparar: "true"
            herramientas: apt-get update -qq && apt-get install -y -qq xvfb desktop-file-utils
          - imagen: ubuntu:22.04  # Python 3.10, la versión mínima
            preparar: "true"
            herramientas: apt-get update -qq && apt-get install -y -qq xvfb desktop-file-utils
          - imagen: fedora:latest
            preparar: dnf install -y tar gzip
            herramientas: dnf install -y xorg-x11-server-Xvfb desktop-file-utils
          - imagen: opensuse/tumbleweed
            preparar: zypper --non-interactive install tar gzip
            herramientas: zypper --non-interactive install xorg-x11-server-Xvfb desktop-file-utils
    runs-on: ubuntu-latest
    container: ${{ matrix.imagen }}
    env:
      LANG: C.UTF-8
    steps:
      - name: Preparar el contenedor
        run: ${{ matrix.preparar }}
      - uses: actions/checkout@v5
      - name: Instalar con instalar.sh (instala Python y las bibliotecas de Qt)
        run: sh instalar.sh -y
      - name: Órdenes instaladas y diagnóstico
        run: |
          "$HOME/.local/bin/ajustelab" --version
          "$HOME/.local/bin/ajustelab-cli" --help > /dev/null
          "$HOME/.local/bin/ajustelab" --diagnostico
      - name: Herramientas de prueba (Xvfb, desktop-file-validate)
        run: ${{ matrix.herramientas }}
      - name: Entrada del menú válida
        run: desktop-file-validate "$HOME/.local/share/applications/ajustelab.desktop"
      - name: Abrir la ventana en X11 (plugin xcb)
        run: |
          Xvfb :99 -screen 0 1280x800x24 &
          sleep 3
          DISPLAY=:99 QT_QPA_PLATFORM=xcb "$HOME/.local/bin/ajustelab" --probar-interfaz
      - name: Volver a ejecutar (actualizar) y desinstalar
        run: |
          sh instalar.sh -y
          sh instalar.sh -y --desinstalar
          test ! -e "$HOME/.local/bin/ajustelab"
          test ! -e "$HOME/.local/share/applications/ajustelab.desktop"
          test ! -e "$HOME/.local/share/ajustelab"

  # Los scripts de los pasos van en ASCII: Windows PowerShell 5.1 los lee como CP1252.
  instalador-windows:
    name: instalar.ps1 en Windows (${{ matrix.shell }})
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]  # Windows PowerShell 5.1 (el que trae Windows) y PowerShell 7
    runs-on: windows-latest
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: PSScriptAnalyzer
        if: matrix.shell == 'pwsh'
        run: |
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          $r = Invoke-ScriptAnalyzer -Path instalar.ps1 -Severity Error,Warning -ExcludeRule PSAvoidUsingWriteHost
          $r | Format-Table -AutoSize | Out-String -Width 220 | Write-Host
          if ($r) { exit 1 }
      - name: Instalar desde esta copia
        run: |
          & ${{ matrix.shell }} -NoProfile -ExecutionPolicy Bypass -File .\instalar.ps1 -Si
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Órdenes, acceso directo, asociación, PATH y entrada de Aplicaciones
        run: |
          $raiz = "$env:LOCALAPPDATA\Programs\ajustelab"
          & "$raiz\bin\ajustelab.cmd" --version
          if ($LASTEXITCODE) { exit 1 }
          & "$raiz\bin\ajustelab-cli.exe" --help | Out-Null
          if ($LASTEXITCODE) { exit 1 }
          & "$raiz\bin\ajustelab.cmd" --diagnostico
          if (-not (Test-Path "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\ajustelab.lnk")) { throw 'Falta el acceso del menu Inicio' }
          if (-not (Test-Path "$([Environment]::GetFolderPath('Desktop'))\ajustelab.lnk")) { throw 'Falta el acceso del escritorio' }
          if ((Get-ItemProperty 'HKCU:\Software\Classes\.ajustelab').'(default)' -ne 'WetZap.ajustelab.sesion') { throw 'Falta la asociacion' }
          $u = Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\ajustelab'
          "$($u.DisplayName) $($u.DisplayVersion): $($u.UninstallString)"
          if (-not (Test-Path "$raiz\desinstalar.ps1")) { throw 'Falta el desinstalador' }
          if ([Environment]::GetEnvironmentVariable('Path', 'User') -notlike "*$raiz\bin*") { throw 'No esta en el PATH' }
          # El lanzador sin consola (el del menu Inicio) con la salida redirigida
          Start-Process "$raiz\venv\Scripts\ajustelab.exe" -ArgumentList '--version' -Wait -NoNewWindow -RedirectStandardOutput salida.txt
          Get-Content salida.txt
          if (-not (Select-String -Path salida.txt -Pattern '^ajustelab 1\.' -Quiet)) { throw 'ajustelab.exe --version no escribe nada' }
      - name: Abrir la ventana de verdad (plugin «windows» de Qt)
        run: |
          & "$env:LOCALAPPDATA\Programs\ajustelab\venv\Scripts\python.exe" -m ajustelab --probar-interfaz
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Reinstalar con la línea de la documentación (irm | iex, desde este commit)
        env:
          AJUSTELAB_SI: "1"
          AJUSTELAB_DESDE: ${{ github.workspace }}
        run: |
          irm "https://raw.githubusercontent.com/WetZap/Programa_Python/${{ github.event.pull_request.head.sha || github.sha }}/instalar.ps1" | iex
          if ($AjCodigo) { exit $AjCodigo }
      - name: Desinstalar con el desinstalador de Configuración > Aplicaciones
        run: |
          $u = Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\ajustelab'
          powershell -NoProfile -ExecutionPolicy Bypass -File "$($u.InstallLocation)\desinstalar.ps1" -Si
          $raiz = "$env:LOCALAPPDATA\Programs\ajustelab"
          if (Test-Path $raiz) { throw 'Queda la carpeta' }
          if (Test-Path 'HKCU:\Software\Classes\.ajustelab') { throw 'Queda la asociacion' }
          if (Test-Path 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\ajustelab') { throw 'Queda la entrada de Aplicaciones' }
          if (Test-Path "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\ajustelab.lnk") { throw 'Queda el acceso directo' }
          if ([Environment]::GetEnvironmentVariable('Path', 'User') -like "*$raiz\bin*") { throw 'Sigue en el PATH' }
          'Desinstalado sin restos'
