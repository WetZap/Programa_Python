# Ejecuta los tests en Linux, Windows y macOS con la versión de Python más
# antigua y la más reciente soportadas. La interfaz se prueba sin pantalla
# (QT_QPA_PLATFORM=offscreen).
name: tests

on:
  push:
  pull_request:

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Bibliotecas de sistema que necesita Qt (solo Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Instalar
        run: python -m pip install -e . pytest
      - name: Tests rápidos (incluye la interfaz)
        run: python -m pytest -m "not lento"
      - name: Validación Monte Carlo completa
        if: runner.os == 'Linux' && matrix.python == '3.13'
        run: python -m pytest -m lento
