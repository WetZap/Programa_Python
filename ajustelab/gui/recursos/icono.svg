<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <title>ajustelab</title>
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3f8fec"/>
      <stop offset="1" stop-color="#1f5bb8"/>
    </linearGradient>
    <linearGradient id="brillo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="54" fill="url(#fondo)"/>
  <rect x="8" y="8" width="240" height="240" rx="54" fill="url(#brillo)"/>
  <!-- ejes -->
  <path d="M50 44 V206 H214" fill="none" stroke="#ffffff" stroke-opacity="0.55" stroke-width="9"
        stroke-linecap="round" stroke-linejoin="round"/>
  <!-- curva ajustada (descarga exponencial) -->
  <path d="M60 58 C 92 140, 128 176, 212 186" fill="none" stroke="#ff8a4c" stroke-width="15"
        stroke-linecap="round"/>
  <!-- datos con barras de error, repartidos a ambos lados de la curva -->
  <g stroke="#ffffff" stroke-width="6" stroke-linecap="round">
    <path d="M76 53 V107"/>
    <path d="M108 126 V180"/>
    <path d="M146 154 V208"/>
    <path d="M190 143 V197"/>
  </g>
  <g fill="#ffffff" stroke="#2667c4" stroke-width="4">
    <circle cx="76" cy="80" r="13"/>
    <circle cx="108" cy="153" r="13"/>
    <circle cx="146" cy="181" r="13"/>
    <circle cx="190" cy="170" r="13"/>
  </g>
</svg>
